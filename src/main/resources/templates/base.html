<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>智课堂 · 大学课堂互动与学情分析系统</title>
</head>
<body>

<!-- ============================================================
     base.html —— 全站"统一布局"的唯一来源
     所有业务页面通过 th:insert 引用下面 4 个片段：
       head    : 公共样式（theme.css 定义配色/圆角/阴影等视觉规范）
       topbar  : 顶部栏（Logo + 当前用户信息 + 退出）
       sidebar : 左侧菜单（按角色渲染，active 参数高亮当前页）
       tail    : 公共脚本（ECharts + 接口封装）
     由此保证全部页面"同一套导航、同一套配色、同一套组件样式"。
     ============================================================ -->

<!-- ---------- 公共 head ---------- -->
<th:block th:fragment="head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</th:block>

<!-- ---------- 顶部栏 ---------- -->
<header class="app-topbar" th:fragment="topbar">
    <button class="menu-toggle" onclick="toggleSidebar()" aria-label="菜单">☰</button>
    <div class="app-logo">
        <span class="logo-mark">智</span><span th:text="${appName} ?: '智课堂'">智课堂</span>
    </div>
    <div class="topbar-right">
        <span class="user-chip">
            <span class="avatar" th:text="${currentUser != null} ? ${#strings.substring(currentUser.realName,0,1)} : '?'">智</span>
            <span th:text="${currentUser != null} ? ${currentUser.realName} : ''">未登录</span>
            （<span th:text="${currentUser != null} ? ${currentUser.roleCn} : ''">-</span>）
        </span>
        <button class="btnx ghost sm" onclick="logout()">退出登录</button>
    </div>
</header>

<!-- ---------- 侧边栏 ---------- -->
<aside class="app-sidebar" th:fragment="sidebar(active)" id="appSidebar">
    <div class="nav-group-title">
        功能菜单
        <button class="sidebar-close" onclick="toggleSidebar()" aria-label="收起菜单">×</button>
    </div>

    <!-- 系统管理员：后台管理 -->
    <th:block th:if="${currentUser != null and currentUser.role == 'admin'}">
        <div class="nav-group-title">系统管理</div>
        <a class="side-link" th:classappend="${active == 'monitor'} ? 'active' : ''" href="/admin/monitor">
            <span class="ico">◉</span>系统监控</a>
        <a class="side-link" th:classappend="${active == 'users'} ? 'active' : ''" href="/admin/users">
            <span class="ico">👤</span>用户与角色</a>
        <a class="side-link" th:classappend="${active == 'perms'} ? 'active' : ''" href="/admin/perms">
            <span class="ico">🔑</span>权限配置</a>
        <a class="side-link" th:classappend="${active == 'config'} ? 'active' : ''" href="/admin/config">
            <span class="ico">⚙</span>系统配置</a>
        <a class="side-link" th:classappend="${active == 'logs'} ? 'active' : ''" href="/admin/logs">
            <span class="ico">🧾</span>操作日志</a>
        <a class="side-link" th:classappend="${active == 'backup'} ? 'active' : ''" href="/admin/backup">
            <span class="ico">🗄</span>数据备份</a>
        <div class="nav-group-title">教学业务（教师视图）</div>
    </th:block>

    <th:block th:if="${currentUser != null and currentUser.role == 'student'}">
        <a class="side-link" th:classappend="${active == 'courses'} ? 'active' : ''" href="/student/courses">
            <span class="ico">▤</span>我的课程</a>
        <a class="side-link" th:classappend="${active == 'report'} ? 'active' : ''" href="/student/report">
            <span class="ico">◈</span>我的学情</a>
    </th:block>

    <th:block th:if="${currentUser != null and currentUser.role != 'student'}">
        <a class="side-link" th:classappend="${active == 'dashboard'} ? 'active' : ''" href="/teacher/dashboard">
            <span class="ico">◎</span>教学总览</a>
        <a class="side-link" th:classappend="${active == 'lessons'} ? 'active' : ''" href="/teacher/lessons">
            <span class="ico">▤</span>课堂管理</a>
        <a class="side-link" th:classappend="${active == 'interactions'} ? 'active' : ''" href="/teacher/interactions">
            <span class="ico">✦</span>课堂互动</a>
        <a class="side-link" th:classappend="${active == 'assignments'} ? 'active' : ''" href="/teacher/assignments">
            <span class="ico">▣</span>作业管理</a>
        <a class="side-link" th:classappend="${active == 'analytics'} ? 'active' : ''" href="/teacher/analytics">
            <span class="ico">◈</span>学情分析</a>
        <a class="side-link" th:classappend="${active == 'students'} ? 'active' : ''" href="/teacher/students">
            <span class="ico">⚑</span>学业预警</a>
    </th:block>

    <div class="nav-group-title" style="margin-top:18px">关于系统</div>
    <div style="padding:0 14px;color:var(--text-sub);font-size:12px;line-height:1.8">
        大学课堂互动与<br>学情分析系统 v1.0<br>
        <span style="color:var(--primary)">Spring Boot + MySQL</span>
    </div>
</aside>

<!-- ---------- 公共脚本 ---------- -->
<th:block th:fragment="tail">
    <script th:src="@{/vendor/echarts.min.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script>
        function logout() {
            apiPost('/api/auth/logout').then(function () { location.href = '/login'; });
        }

        /* 移动端：侧边栏抽屉开合 */
        function toggleSidebar() {
            var bar = document.getElementById('appSidebar');
            var mask = document.getElementById('appMask');
            if (!bar) return;
            var open = bar.classList.toggle('open');
            if (!mask) {
                mask = document.createElement('div');
                mask.id = 'appMask';
                mask.className = 'app-mask';
                mask.onclick = function () { toggleSidebar(); };
                document.body.appendChild(mask);
            }
            mask.style.display = open ? 'block' : 'none';
        }
    </script>
</th:block>

</body>
</html>
